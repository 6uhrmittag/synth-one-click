name: Build synth_one_click_installer.exe

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - '**'

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Dart
      uses: dart-lang/setup-dart@v1

    - name: Install dependencies
      run: dart pub get

    - name: Analyze code
      run: dart analyze --fatal-infos --fatal-warnings

    - name: Build executable
      run: |
        if [ "${{ github.ref }}" == "refs/heads/main" ]; then
          dart compile exe bin/synth_one_click_installer.dart -o build/synth_one_click_installer.exe
        else
          dart compile exe bin/synth_one_click_installer.dart -o build/synth_one_click_installer-dev.exe
        fi

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: synth_one_click_installer
        path: |
          build/synth_one_click_installer.exe
          build/synth_one_click_installer-dev.exe
