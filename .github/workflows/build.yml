name: Build synth_one_click_installer.exe

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - '**'

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Dart
      uses: dart-lang/setup-dart@v1

    - name: Install dependencies
      run: dart pub get

    - name: Analyze code
      run: dart analyze || true # YOLO mode

    - name: Build executable
      run: |
        if ($env:GITHUB_REF -eq 'refs/heads/main') {
          dart compile exe bin/synth_one_click_installer.dart -o build/synth_one_click_installer.exe
        } else {
          dart compile exe bin/synth_one_click_installer.dart -o build/synth_one_click_installer-dev.exe
        }

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: synth_one_click_installer
        path: |
          build/synth_one_click_installer.exe
          build/synth_one_click_installer-dev.exe
